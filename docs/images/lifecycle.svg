<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t">
<title id="t">任务生命周期：八种状态</title>
<defs>
<style>
svg{--bg:#faf9f5;--ink:#1d1c19;--muted:#6e6b64;--line:#d6d3cb;--card:#fff;--item:#f4f2ec;--accent:#c2491d;--you-bg:#fff4ee}
@media (prefers-color-scheme:dark){svg{--bg:#151412;--ink:#f1efe9;--muted:#a29e95;--line:#45433d;--card:#1e1d1a;--item:#262420;--accent:#ef8a62;--you-bg:#2a1f1a}}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:14px;fill:var(--ink)}
.s{font-size:12.5px;fill:var(--muted)}
.l{font-size:13px;font-weight:600;fill:var(--accent)}
.bg{fill:var(--bg)}
.state{fill:var(--card);stroke:var(--muted);stroke-width:1.3}
.term{fill:var(--item);stroke:var(--line);stroke-width:1.3}
.human{fill:var(--you-bg);stroke:var(--accent);stroke-width:1.8}
.sn{font-size:15.5px;font-weight:700}
.sd{font-size:12px;fill:var(--muted)}
.conn{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#a)}
.flow{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#b)}
.back{fill:none;stroke:var(--accent);stroke-width:1.7;stroke-dasharray:6 4;marker-end:url(#a)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="600" rx="18"/>

<!-- 上行：审批分支 -->
<rect class="human" x="300" y="80" width="180" height="64" rx="12"/>
<text x="390" y="108" class="sn" text-anchor="middle">auth-required</text>
<text x="390" y="128" class="sd" text-anchor="middle">等机主审批（静态 / 动态）</text>

<rect class="term" x="740" y="80" width="180" height="64" rx="12"/>
<text x="830" y="108" class="sn" text-anchor="middle">canceled</text>
<text x="830" y="128" class="sd" text-anchor="middle">审批驳回 / 撤单 · 终态</text>

<path class="conn" d="M482 112H734"/>
<text x="608" y="100" class="l" text-anchor="middle">驳回</text>

<path class="conn" d="M330 282V150"/>
<text x="322" y="205" class="l" text-anchor="end">认领前 / 执行中</text>
<path class="back" d="M450 144V244"/>
<text x="458" y="205" class="l">批准（待认领 / 续跑）</text>

<!-- 主行 -->
<rect class="state" x="40" y="250" width="180" height="64" rx="12"/>
<text x="130" y="278" class="sn" text-anchor="middle">submitted</text>
<text x="130" y="298" class="sd" text-anchor="middle">建单 · 等待认领</text>

<rect class="state" x="390" y="250" width="180" height="64" rx="12"/>
<text x="480" y="278" class="sn" text-anchor="middle">working</text>
<text x="480" y="298" class="sd" text-anchor="middle">节点执行中</text>

<rect class="term" x="740" y="250" width="180" height="64" rx="12"/>
<text x="830" y="278" class="sn" text-anchor="middle">completed</text>
<text x="830" y="298" class="sd" text-anchor="middle">完成 · 终态</text>

<path class="flow" d="M222 282H384"/>
<text x="276" y="270" class="l" text-anchor="middle">认领</text>
<path class="flow" d="M572 282H734"/>
<text x="653" y="270" class="l" text-anchor="middle">执行成功</text>

<!-- 下行：提问、失败、拒收 -->
<rect class="term" x="40" y="420" width="180" height="64" rx="12"/>
<text x="130" y="448" class="sn" text-anchor="middle">rejected</text>
<text x="130" y="468" class="sd" text-anchor="middle">能力不存在 · 终态</text>
<path class="flow" d="M130 314V414"/>
<text x="140" y="368" class="l">无此能力 / 离线</text>

<rect class="human" x="390" y="420" width="180" height="64" rx="12"/>
<text x="480" y="448" class="sn" text-anchor="middle">input-required</text>
<text x="480" y="468" class="sd" text-anchor="middle">向发起方提问</text>
<path class="conn" d="M505 314V414"/>
<text x="513" y="368" class="l">提问</text>
<path class="back" d="M455 420V320"/>
<text x="447" y="368" class="l" text-anchor="end">答复 · 原任务续跑</text>

<rect class="term" x="740" y="420" width="180" height="64" rx="12"/>
<text x="830" y="448" class="sn" text-anchor="middle">failed</text>
<text x="830" y="468" class="sd" text-anchor="middle">多次失败 · 终态</text>
<path class="flow" d="M572 300H648V452H734"/>
<text x="656" y="380" class="l">失败超限</text>

<text x="480" y="540" class="s" text-anchor="middle">终态不可变：completed / failed / canceled / rejected 不再迁移，后续工作在同一 Context_ID 下新建任务</text>
<text x="480" y="564" class="s" text-anchor="middle">working 失败未达上限：退避后回到 submitted 重新认领（重试与回收共用上限 2 次）</text>
</svg>
